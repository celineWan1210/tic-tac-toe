<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://db.onlinewebfonts.com/c/5f2a767429461ed48fadeff6ccf9e42c?family=Gamera" rel="stylesheet">
</head>
<body>
    <div class="header">
        <div class="header-title">Tic Tac Toe</div>
    </div>
    <div class="content">
        <dialog class="game-over">
            <div class="header">
                <div class="header-title">Game Over</div>
            </div>
            <div class="content">
                <div class="winner-info"></div>
                <button class="replay-button"><img src="images/replay.svg" alt="replay button"></button>
            </div>
        </dialog>

        <dialog class="player-enter-name">
            <div class="header">
                <div class="header-title">Enter Player Name</div>
            </div>
            <form>
                <div class="player-1-form-section">
                    <p>Player 1</p>
                    <label for="player-1-name" r>Enter name</label>
                    <input type="text" id="player-1-name" required>
                </div>
                <div class="player-2-form-section">
                    <p>Player 2</p>
                    <label for="player-2-name">Enter name</label>
                    <input type="text" id="player-2-name" required>
                </div>
                <div class="submit-button">
                    <button type="submit" id="confirmBtn">Submit</button>
                </div>
            </form>
        </dialog>

        <div class="player-name-section">
            <div class="player-info">
                <div class="player-1-section">
                    <div class="player1">Player 1</div>
                    <div class="score">0</div>
                </div>
                <div class="vs">VS</div>
                <div class="player-2-section">
                    <div class="player2">Player 2</div>
                    <div class="score">0</div>
                </div>
            </div>
        </div>
        <div class="play-section">
            <div class="grid" id="R1C1"></div>
            <div class="grid" id="R1C2"></div>
            <div class="grid" id="R1C3"></div>
            <div class="grid" id="R2C1"></div>
            <div class="grid" id="R2C2"></div>
            <div class="grid" id="R2C3"></div>
            <div class="grid" id="R3C1"></div>
            <div class="grid" id="R3C2"></div>
            <div class="grid" id="R3C3"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
